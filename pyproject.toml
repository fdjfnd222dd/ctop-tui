[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctop-tui"
version = "0.1.0"
description = "A btop-style full-screen terminal dashboard: RAM ring by program, battery watts, network and security views."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nick B" }]
keywords = ["tui", "terminal", "system-monitor", "btop", "battery", "network-monitoring", "textual", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = ["textual>=0.80", "psutil>=5.9", "rich>=13"]

[project.urls]
Homepage = "https://github.com/fdjfnd222dd/ctop-tui"
Repository = "https://github.com/fdjfnd222dd/ctop-tui"
Issues = "https://github.com/fdjfnd222dd/ctop-tui/issues"

[project.scripts]
ctop = "ctop.app:main"

[tool.setuptools]
packages = ["ctop", "ctop.panels", "ctop.collectors", "ctop.render", "ctop.tools"]
