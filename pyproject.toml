[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctop-tui"
version = "0.1.0"
description = "A btop-style full-screen terminal dashboard: RAM ring by program, battery watts, network and security views."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["textual>=0.80", "psutil>=5.9", "rich>=13"]

[project.scripts]
ctop = "ctop.app:main"

[tool.setuptools]
packages = ["ctop", "ctop.panels", "ctop.collectors", "ctop.render"]
